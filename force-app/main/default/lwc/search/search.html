<template>
  <lightning-card title="Search" icon-name="standard:search">
    <div class="slds-m-around_medium">
      <lightning-input
        value={searchTerm}
        onkeypress={runSearch}
      ></lightning-input>
      <br />
      <template lwc:if={searchResult}>
        <template for:each={searchResult} for:item="link">
          <div key={link.Id} class="slds-m-bottom_small">
            <div>
              <lightning-formatted-url
                value={link.URL__c}
                label={link.Name}
              ></lightning-formatted-url> - {link.Description__c}
            </div>
            <template lwc:if={link.TagAssociations__r}>
              <div class="slds-m-top_xx-small">
                <template
                  for:each={link.TagAssociations__r}
                  for:item="tagAssoc"
                >
                  <lightning-badge
                    key={tagAssoc.Id}
                    label={tagAssoc.Tag__r.Name}
                    class="slds-m-right_xx-small"
                  ></lightning-badge>
                </template>
              </div>
            </template>
          </div>
        </template>
      </template>
      <template lwc:elseif={error}> Error: {error} </template>
    </div>
  </lightning-card>
</template>
